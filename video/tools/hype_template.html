<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Exposure, Handled.</title>
    <!-- The hype cut. video/hype/index.html is made from this template by video/tools/build_hype.py (the edit, in beats of the
         music, lives there; edit.js carries it in seconds). 3D shots: video/tools/capture_hype.py. Every real number
         comes from the Oct 19 FX2 test (site/data/site.json), and every shot carries a small tag: 3D ILLUSTRATION,
         REAL, PLACEHOLDER or STAND-IN. -->
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="edit.js"></script>
    <style>
      @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/InstrumentSerif-Regular.woff2") format("woff2"); }
      @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/InstrumentSerif-Italic.woff2") format("woff2"); font-style: italic; }
      @font-face { font-family: "D-DIN"; src: url("assets/fonts/D-DIN.woff2") format("woff2"); }
      @font-face { font-family: "D-DIN"; src: url("assets/fonts/D-DIN-Bold.woff2") format("woff2"); font-weight: 700; }
      @font-face { font-family: "D-DIN Exp"; src: url("assets/fonts/D-DINExp.woff2") format("woff2"); }
      @font-face { font-family: "D-DIN Exp"; src: url("assets/fonts/D-DINExp-Bold.woff2") format("woff2"); font-weight: 700; }

      :root {
        --bg: #050505; --ink: #f2f1ee; --ink-2: #a8a7a3; --fine: #9a9995;
        --ai: #ff6a1a; --ai-2: #ffa25c; --good: #29c7ac; --warn: #f5b83d; --bad: #ff4b3e; --ill: #b9b4ff; --stand: #ffd23a;
        --serif: "Instrument Serif", "Times New Roman", serif; --sans: "D-DIN", "Helvetica Neue", Arial, sans-serif;
        --wide: "D-DIN Exp", "D-DIN", "Helvetica Neue", Arial, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
        font-family: var(--sans); -webkit-font-smoothing: antialiased; }
      .clip { position: absolute; inset: 0; }

      /* shots: each in an untimed wrapper (the wrapper takes the pushes and punches; videos time themselves) */
      .shot { position: absolute; inset: 0; overflow: hidden; }
      .shot video, .shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .shot .layer { position: absolute; inset: 0; }

      /* the camera HUD on the real live view */
      .hud { position: absolute; left: 50%; bottom: 92px; transform: translateX(-50%); display: flex; gap: 14px; z-index: 6; }
      .cell { min-width: 230px; padding: 16px 26px 14px; border-radius: 12px; background: rgba(5, 5, 5, .62);
        border: 1.5px solid rgba(255, 255, 255, .14); text-align: left; }
      .cell .k { font: 700 15px/1 var(--wide); letter-spacing: .24em; color: var(--ink-2); }
      .cell .v { transform-origin: left center; margin-top: 10px; font: 700 64px/1 var(--wide); letter-spacing: .01em; font-variant-numeric: tabular-nums; }
      .hud.big .cell { min-width: 340px; padding: 20px 34px 18px; text-align: center; }
      .hud.big .cell .v { font-size: 128px; transform-origin: center; }
      .cell.hot { border-color: var(--ai); }
      .cell.hot .v { color: var(--ai-2); }
      .status { position: absolute; left: 50%; top: 84px; transform: translateX(-50%); z-index: 6; display: inline-flex; gap: 12px;
        align-items: center; padding: 12px 20px 11px; border-radius: 999px; background: rgba(5, 5, 5, .6); border: 1.5px solid currentColor;
        font: 700 18px/1 var(--wide); letter-spacing: .22em; white-space: nowrap; opacity: 0; }
      .status i { width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
      .status.ai { color: var(--ai-2); } .status.good { color: var(--good); }

      /* big words */
      .word { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); z-index: 30; text-align: center;
        opacity: 0; white-space: nowrap; text-shadow: 0 0 60px rgba(0, 0, 0, .55), 0 2px 18px rgba(0, 0, 0, .45); }
      .word.caps { font: 700 168px/1 var(--wide); letter-spacing: -.005em; text-transform: uppercase; }
      .word.caps .dot, .word.title .dot { color: var(--ai); }
      .word.serif { font: 400 156px/1 var(--serif); letter-spacing: -.012em; }
      .word.serif em { font-style: italic; }
      .word.serif .pre { display: block; margin-bottom: 18px; font: 700 38px/1 var(--wide); letter-spacing: .32em; text-transform: uppercase; color: var(--ink); }
      .word.title { top: 21%; font: 400 176px/1 var(--serif); letter-spacing: -.014em; }
      .word.title em { font-style: italic; }

      /* the one stat */
      #stat { position: absolute; inset: 0; z-index: 31; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; }
      #stat .n { display: flex; align-items: baseline; gap: 18px; font: 700 330px/0.9 var(--wide); letter-spacing: -.02em;
        font-variant-numeric: tabular-nums; text-shadow: 0 0 80px rgba(255, 75, 62, .35); }
      #stat .n small { font-size: 120px; letter-spacing: .02em; color: var(--ink); }
      #stat .l { margin-top: 34px; padding: 12px 22px 11px; border-radius: 999px; background: rgba(5, 5, 5, .7); font: 700 20px/1 var(--wide);
        letter-spacing: .3em; color: var(--ink); text-transform: uppercase; }
      #stat .l b { color: var(--good); font-weight: 700; }

      /* light */
      #flash { position: absolute; inset: 0; z-index: 28; background: #fff; opacity: 0; pointer-events: none; }
      #redwash { position: absolute; inset: 0; z-index: 27; opacity: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, rgba(255, 60, 40, 0) 35%, rgba(255, 50, 30, .38) 100%); }
      .streak { position: absolute; left: -30%; width: 160%; height: 4px; z-index: 29; opacity: 0; pointer-events: none; mix-blend-mode: screen;
        background: linear-gradient(90deg, rgba(255, 120, 40, 0) 0%, rgba(255, 140, 60, .55) 35%, rgba(255, 236, 214, 1) 50%, rgba(255, 140, 60, .55) 65%, rgba(255, 120, 40, 0) 100%);
        box-shadow: 0 0 22px 6px rgba(255, 120, 40, .45), 0 0 80px 18px rgba(255, 106, 26, .22); }

      /* honesty: a small tag on every shot */
      .tag { position: absolute; left: 48px; bottom: 44px; z-index: 40; display: inline-flex; align-items: center; gap: 9px;
        padding: 7px 12px 6px; border-radius: 999px; border: 1.2px solid currentColor; background: rgba(5, 5, 5, .55);
        font: 700 12px/1 var(--wide); letter-spacing: .2em; text-transform: uppercase; white-space: nowrap; opacity: 0; }
      .tag i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
      .tag.ill { color: var(--ill); } .tag.real { color: var(--good); } .tag.ph { color: var(--warn); }
      .tag.stand { color: #111; background: var(--stand); border-color: var(--stand); }

      /* end card */
      #end { position: absolute; left: 0; right: 0; bottom: 92px; z-index: 32; text-align: center; opacity: 0; }
      #end .sub { font: 700 22px/1 var(--wide); letter-spacing: .32em; color: var(--ink); }
      #end .by { margin-top: 30px; font: 400 26px/1.2 var(--sans); color: var(--ink); }
      #end .url { margin-top: 10px; font: 400 22px/1.2 var(--sans); color: var(--ai-2); letter-spacing: .02em; }
      #end .fine { margin-top: 26px; font: 400 16px/1.5 var(--sans); color: var(--fine); }

      #black { position: absolute; inset: 0; z-index: 60; background: #000; opacity: 0; pointer-events: none; }
      .vignette { position: absolute; inset: 0; z-index: 26; pointer-events: none;
        background: radial-gradient(ellipse at center, rgba(0,0,0,0) 58%, rgba(0,0,0,.5) 100%); }
      #grain { position: absolute; inset: -10%; z-index: 50; pointer-events: none; opacity: .07; background: url("assets/grain.png");
        background-size: 320px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DURATION}}" data-width="1920" data-height="1080">
{{SHOTS}}
      <div id="words"></div>
      <div id="stat"><div class="n"><span id="statN"></span><small>ms</small></div><div class="l" id="statL"></div></div>
      <div id="redwash"></div>
      <div id="flash"></div>
      <div class="streak" id="streak1"></div>
      <div class="streak" id="streak2"></div>
      <div class="streak" id="streak3"></div>
      <div class="streak" id="streak4"></div>
      <div id="tags"></div>
      <div id="end">
        <div class="sub">CAMERA AGENT · AN AI ASSISTANT FOR CINEMA CAMERAS</div>
        <div class="by">Designed &amp; built by Saad Hilal · S4D</div>
        <div class="url">github.com/saadhilalai/exposure-handled</div>
        <div class="fine" id="fine"></div>
      </div>
      <div class="vignette"></div>
      <div id="grain"></div>
      <div id="black"></div>
      <audio id="mix" src="assets/audio/mix.m4a" data-start="0" data-duration="{{DURATION}}" data-media-start="0" data-track-index="40" data-volume="1"></audio>
    </div>

    <script>
      (function () {
        var E = window.EDIT, tl = gsap.timeline({ paused: true });
        var $ = function (s) { return document.querySelector(s); };
        var root = $("#root");
        function mk(tag, cls, html, parent) { var d = document.createElement(tag); if (cls) d.className = cls; if (html != null) d.innerHTML = html; (parent || root).appendChild(d); return d; }
        // entrances never overlap their own exits; exits never write their start state early
        function later(el, from, to, at) { to.immediateRender = false; tl.fromTo(el, from, to, at); }
        function show(el, a, b) { tl.set(el, { autoAlpha: 0 }, 0); tl.set(el, { autoAlpha: 1 }, a); if (b != null) tl.set(el, { autoAlpha: 0 }, b); }

        // ---------- shots: pushes, punches, image windows ----------
        E.shots.forEach(function (s) {
          var w = $("#" + s.id);
          if (s.img || s.frames) show(w, s.at, s.to);
          var p = s.push || [1, 1.04];
          if (s.origin) w.style.transformOrigin = s.origin;
          tl.fromTo(w, { scale: p[0] }, { scale: p[1], duration: s.to - s.at, ease: "none" }, s.at);
          if (s.punch) later(w, { scale: p[0] * s.punch }, { scale: p[0], duration: 0.22, ease: "power3.out" }, s.at);
        });
        // frame sequences (the real live view): each frame shown from its time to the next
        E.shots.forEach(function (s) {
          if (!s.frames) return;
          var imgs = document.querySelectorAll("#" + s.id + " img");
          s.frames.forEach(function (f, i) { var nxt = i + 1 < s.frames.length ? s.frames[i + 1].at : s.to; show(imgs[i], f.at, nxt); });
        });

        // ---------- the camera HUD on the real frames ----------
        E.huds.forEach(function (h) {
          var hud = $("#" + h.id);
          h.cells.forEach(function (c, i) {             // a punch on every change (the values themselves: the clock below)
            var v = hud.children[i].querySelector(".v");
            c.steps.forEach(function (st) { later(v, { scale: 1.18 }, { scale: 1, duration: 0.18, ease: "power3.out" }, st[0]); });
          });
          later(hud, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.18, ease: "power2.out" }, h.at);
        });
        // the HUD's values as pure functions of time (seek-safe), refreshed by one clock
        var clock = { t: 0 };
        tl.to(clock, { t: E.duration, duration: E.duration, ease: "none", onUpdate: function () {
          var t = clock.t;
          E.huds.forEach(function (h) {
            var hud = document.getElementById(h.id);
            h.cells.forEach(function (c, i) {
              var cell = hud.children[i], v = cell.querySelector(".v"), val = c.from, hot = false;
              c.steps.forEach(function (st) { if (t >= st[0]) { val = st[1]; hot = true; } });
              if (v.textContent !== val) v.textContent = val;
              cell.classList.toggle("hot", hot && t < (c.cool || 1e9));
            });
          });
        } }, 0);
        E.statuses.forEach(function (s) {
          var d = mk("div", "status " + s.kind, "<i></i>" + s.text, $("#" + s.shot));
          later(d, { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power3.out" }, s.at);
          later(d, { opacity: 1 }, { opacity: 0, duration: 0.08, ease: "none" }, s.to - 0.08);
        });

        // ---------- big words ----------
        E.words.forEach(function (w) {
          var d = mk("div", "word " + w.style, w.html, $("#words"));
          later(d, { opacity: 0, scale: 1.14, filter: "blur(16px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.24, ease: "power3.out" }, w.at);
          later(d, { scale: 1 }, { scale: 0.965, duration: Math.max(0.1, w.to - w.at - 0.24), ease: "none" }, w.at + 0.24);
          if (w.out !== false) later(d, { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "none" }, w.to - 0.12);
        });

        // ---------- the stat ----------
        $("#statN").textContent = E.stat.n;
        $("#statL").innerHTML = E.stat.label;
        later("#stat", { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power4.out" }, E.stat.at);
        later("#stat", { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "none" }, E.stat.to - 0.15);

        // ---------- light: flashes, the kill's red, streaks ----------
        E.flashes.forEach(function (f) {
          later("#flash", { opacity: f[1] }, { opacity: 0, duration: f[2] || 0.28, ease: "power2.out" }, f[0]);
        });
        later("#redwash", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, E.kill[0]);
        later("#redwash", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.in" }, E.kill[1] - 0.3);
        E.streaks.forEach(function (s, i) {
          var el = "#streak" + (i % 4 + 1);
          later(el, { top: s[1] + "%", x: s[2] > 0 ? -420 : 420, opacity: 0, scaleY: 0.4 },
            { x: s[2] > 0 ? 420 : -420, opacity: 1, scaleY: 1.4, duration: 0.18, ease: "power2.out" }, s[0]);
          later(el, { opacity: 1 }, { opacity: 0, scaleY: 0.2, duration: 0.32, ease: "power2.in" }, s[0] + 0.18);
        });

        // ---------- tags: what's real, on every shot ----------
        E.tags.forEach(function (g) {
          var d = mk("div", "tag " + g.kind, "<i></i>" + g.text, $("#tags"));
          later(d, { opacity: 0 }, { opacity: 0.92, duration: 0.12, ease: "none" }, g.at);
          later(d, { opacity: 0.92 }, { opacity: 0, duration: 0.08, ease: "none" }, g.to - 0.08);
        });

        // ---------- end card ----------
        $("#fine").innerHTML = E.fine;
        later("#end", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, E.end);
        later("#" + E.dimUnderEnd, { opacity: 1 }, { opacity: 0.4, duration: 0.6, ease: "power2.out" }, E.end);    // the credits read clean
        later("#black", { opacity: 0 }, { opacity: 1, duration: E.fadeOut[1] - E.fadeOut[0], ease: "power1.in" }, E.fadeOut[0]);

        // ---------- grain: the site's tile, stepped 8 times a second ----------
        var G = [[0, 0], [-3, 2], [2, -4], [-4, -2], [3, 3], [-1, 4], [4, -1], [-2, -3]];
        for (var gi = 0; gi < Math.ceil(E.duration * 8); gi++) tl.set("#grain", { xPercent: G[gi % 8][0], yPercent: G[(gi * 3 + 1) % 8][1] }, gi / 8);

        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
