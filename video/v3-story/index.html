<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Exposure, Handled.</title>
    <!-- One of the three launch films. video/v*/index.html is made from this template by video/tools/build_films.py (the
         edit lives there; edit.js carries it). The 3D shots are path-traced in Blender (video/blender/shots.py).
         No tags, no small print: what's real and what's illustrated is written down in video/FILMS.md and the credits. -->
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="edit.js"></script>
    <style>
      @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/InstrumentSerif-Regular.woff2") format("woff2"); }
      @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/InstrumentSerif-Italic.woff2") format("woff2"); font-style: italic; }
      @font-face { font-family: "D-DIN"; src: url("assets/fonts/D-DIN.woff2") format("woff2"); }
      @font-face { font-family: "D-DIN"; src: url("assets/fonts/D-DIN-Bold.woff2") format("woff2"); font-weight: 700; }
      @font-face { font-family: "D-DIN Exp"; src: url("assets/fonts/D-DINExp.woff2") format("woff2"); }
      @font-face { font-family: "D-DIN Exp"; src: url("assets/fonts/D-DINExp-Bold.woff2") format("woff2"); font-weight: 700; }

      :root { --bg: #000; --ink: #f4f3ef; --ai: #ff6a1a;
        --serif: "Instrument Serif", "Times New Roman", serif; --sans: "D-DIN", "Helvetica Neue", Arial, sans-serif;
        --wide: "D-DIN Exp", "D-DIN", "Helvetica Neue", Arial, sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
        font-family: var(--sans); -webkit-font-smoothing: antialiased; }
      .clip { position: absolute; inset: 0; }
      .shot { position: absolute; inset: 0; overflow: hidden; }
      .shot video, .shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

      /* words: solid colour only, never a gradient */
      .word { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); z-index: 30; text-align: center; opacity: 0;
        color: var(--ink); text-shadow: 0 0 50px rgba(0, 0, 0, .5); }
      .word.huge { font: 700 300px/0.9 var(--sans); letter-spacing: -.012em; text-transform: uppercase; white-space: nowrap;
        text-shadow: 0 0 36px rgba(255, 255, 255, .22), 0 0 140px rgba(255, 106, 26, .16); }
      .word.serif { font: 400 150px/1 var(--serif); letter-spacing: -.012em; white-space: nowrap; }
      .word.serif em, .word.title em, .word.line em, .word.quote em { font-style: italic; }
      .word.quote { font: 400 78px/1 var(--serif); letter-spacing: -.005em; white-space: nowrap; }
      .word.name { font: 400 56px/1 var(--serif); letter-spacing: .005em; white-space: nowrap; }
      .word.line { font: 400 96px/1 var(--serif); letter-spacing: -.01em; white-space: nowrap; }
      .word.title { font: 400 176px/1 var(--serif); letter-spacing: -.014em; white-space: nowrap; }
      .word.link { font: 400 40px/1 var(--sans); letter-spacing: .04em; white-space: nowrap; }

      #flash { position: absolute; inset: 0; z-index: 28; background: #fff; opacity: 0; pointer-events: none; }
      #redwash { position: absolute; inset: 0; z-index: 27; opacity: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, rgba(255, 60, 40, 0) 35%, rgba(255, 50, 30, .34) 100%); }
      .streak { position: absolute; left: -30%; width: 160%; height: 4px; z-index: 29; opacity: 0; pointer-events: none; mix-blend-mode: screen;
        background: linear-gradient(90deg, rgba(255, 120, 40, 0) 0%, rgba(255, 140, 60, .55) 35%, rgba(255, 236, 214, 1) 50%, rgba(255, 140, 60, .55) 65%, rgba(255, 120, 40, 0) 100%);
        box-shadow: 0 0 22px 6px rgba(255, 120, 40, .45), 0 0 80px 18px rgba(255, 106, 26, .22); }
      .bar { position: absolute; left: 0; right: 0; height: 138px; z-index: 55; background: #000; display: none; }   /* above flashes and grain: pure black */
      .bar.top { top: 0; } .bar.bot { bottom: 0; }
      #dim { position: absolute; inset: 0; z-index: 25; background: #000; opacity: 0; pointer-events: none; }
      .vignette { position: absolute; inset: 0; z-index: 26; pointer-events: none;
        background: radial-gradient(ellipse at center, rgba(0,0,0,0) 58%, rgba(0,0,0,.45) 100%); }
      #grain { position: absolute; inset: -10%; z-index: 50; pointer-events: none; opacity: .06; background: url("assets/grain.png");
        background-size: 320px; }
      /* "same words, many surfaces": the phrase holds one band of the screen while the surface under it changes every cut */
      .panel { position: absolute; inset: 0; z-index: 28; overflow: hidden; visibility: hidden; }
      .panel .ph { position: absolute; left: 50%; top: 47%; transform: translate(calc(-50% + var(--dx, 0px)), -50%); white-space: nowrap; }
      .grainy::after { content: ""; position: absolute; inset: 0; opacity: .5; mix-blend-mode: multiply; background-size: 360px;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='360' height='360'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .42  0 0 0 0 .38  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
      .p-news { background: #ebe8e1; color: #141210; } .p-news .ph { font: 700 250px/1 "Big Caslon", "Baskerville", serif; letter-spacing: -.02em; }
      .p-code { background: #000; color: #e8e6e1; } .p-code .ph { font: 400 104px/1 Menlo, monospace; }
      .p-code .ph i { font-style: normal; color: #7c7a74; } .p-code .ph b { font-weight: 400; color: #ff8a3d; }
      .p-type { background: #efe6d2; color: #26221c; } .p-type .ph { font: 400 170px/1 "American Typewriter", "Courier New", monospace; letter-spacing: .02em; }
      .p-type::before { content: ""; position: absolute; left: 0; right: 0; top: 61%; height: 3px; background: #26221c; opacity: .8; }
      .p-bauhaus { background: #e7dfcf; color: #0d0d0d; }
      .p-bauhaus::before { content: ""; position: absolute; width: 760px; height: 760px; border-radius: 50%; background: #ff6a1a; left: 58%; top: 50%; transform: translate(-50%, -50%); }
      .p-bauhaus::after { content: ""; position: absolute; left: 6%; top: 18%; width: 46px; height: 64%; background: #0d0d0d; }
      .p-bauhaus .ph { font: 700 210px/1 Futura, "Avenir Next", sans-serif; letter-spacing: -.02em; }
      .p-chalk { background: #000; color: #f1efe8; } .p-chalk .ph { font: 400 190px/1 Chalkduster, "Marker Felt", sans-serif; opacity: .92; }
      .p-readme { background: #ffffff; color: #1f2328; } .p-readme .ph { font: 600 230px/1 -apple-system, "Helvetica Neue", Helvetica, sans-serif; letter-spacing: -.02em; }
      .p-readme .ph i { font-style: normal; color: #9198a1; font-weight: 500; }
      .p-readme::before { content: ""; position: absolute; left: 0; right: 0; top: 64%; height: 2px; background: #d1d9e0; }
      .p-note { background: #000; color: #22201b; }
      .p-note::before { content: ""; position: absolute; left: 50%; top: 50%; width: 1500px; height: 1500px; background: #f6d64a; transform: translate(-50%, -50%) rotate(-3deg);
        box-shadow: 0 30px 80px rgba(0, 0, 0, .45); }
      .p-note .ph { font: 700 200px/1 Noteworthy, "Marker Felt", sans-serif; transform: translate(calc(-50% + var(--dx, 0px)), -50%) rotate(-3deg); }
      .p-cyan { background: #1b4c86; color: #f3f6fa; }
      .p-cyan::before { content: ""; position: absolute; left: 50%; top: 50%; width: 900px; height: 900px; border-radius: 50%; transform: translate(-50%, -50%);
        box-shadow: 0 0 0 2px rgba(255,255,255,.35), 0 0 0 90px rgba(255,255,255,.06), 0 0 0 92px rgba(255,255,255,.28), 0 0 0 220px rgba(255,255,255,.05), 0 0 0 222px rgba(255,255,255,.22); }
      .p-cyan .ph { font: italic 400 230px/1 Didot, "Bodoni 72", serif; }
      .p-term { background: #000; color: #e9e7e2; } .p-term .ph { font: 400 92px/1 Menlo, monospace; } .p-term .ph b { color: #ff6a1a; font-weight: 400; }
      .p-term .ph u { text-decoration: none; display: inline-block; width: .6em; height: 1em; background: #e9e7e2; vertical-align: -.12em; margin-left: .1em; }
      .p-enso { background: #ece6da; color: #111; }
      .p-enso::before { content: ""; position: absolute; left: 50%; top: 50%; width: 820px; height: 820px; border-radius: 50%; border: 34px solid #111;
        border-right-color: transparent; transform: translate(-50%, -50%) rotate(28deg); opacity: .88; }
      .p-enso .ph { font: italic 400 210px/1 Baskerville, "Big Caslon", serif; }
      .p-tape { background: #000; color: #121212; }
      .p-tape::before { content: ""; position: absolute; left: -2%; right: -2%; top: 50%; height: 300px; background: #d9d6cf; transform: translateY(-50%) rotate(1.2deg); }
      .p-tape .ph { font: 700 180px/1 "Marker Felt", Noteworthy, sans-serif; transform: translate(calc(-50% + var(--dx, 0px)), -50%) rotate(1.2deg); }
      .p-blue { background: #173a73; color: #eef3fb; background-size: 60px 60px;
        background-image: linear-gradient(rgba(255,255,255,.12) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.12) 1px, transparent 1px); }
      .p-blue .ph { font: 600 200px/1 "Avenir Next", Avenir, sans-serif; letter-spacing: -.01em; }
      .p-menu { background: #000; color: #fff; }
      .p-menu::before { content: ""; position: absolute; left: 0; right: 0; top: 47%; height: 230px; transform: translateY(-50%); background: #ff6a1a; }
      .p-menu .ph { font: 700 170px/1 var(--wide); letter-spacing: .04em; text-transform: uppercase; color: #0b0b0c; }
      #card { position: absolute; inset: 0; z-index: 29; background: #000; opacity: 0; pointer-events: none; }   /* text-only cards: pure black */
      #black { position: absolute; inset: 0; z-index: 60; background: #000; opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="55.0" data-width="1920" data-height="1080">
      <div class="shot" id="field_a"><video id="v_field_a" class="clip" src="assets/footage/field.mp4" data-start="10.98" data-duration="5.8" data-media-start="0.0" data-track-index="1" muted playsinline></video></div>
      <div class="shot" id="beach"><video id="v_beach" class="clip" src="assets/footage/beach.mp4" data-start="16.78" data-duration="2.82" data-media-start="0.3" data-track-index="2" muted playsinline></video></div>
      <div class="shot" id="fence"><video id="v_fence" class="clip" src="assets/footage/fence.mp4" data-start="19.6" data-duration="6.0" data-media-start="0.0" data-track-index="3" muted playsinline></video></div>
      <div class="shot" id="beach_dark"><video id="v_beach_dark" class="clip" src="assets/footage/beach.mp4" data-start="25.6" data-duration="1.2" data-media-start="3.2" data-track-index="4" muted playsinline></video></div>
      <div class="shot" id="head"><video id="v_head" class="clip" src="assets/footage/head.mp4" data-start="26.8" data-duration="0.8" data-media-start="0.0" data-track-index="5" muted playsinline></video></div>
      <div class="shot" id="train_q"><video id="v_train_q" class="clip" src="assets/footage/train.mp4" data-start="27.6" data-duration="0.5" data-media-start="0.2" data-track-index="6" muted playsinline></video></div>
      <div class="shot" id="catch"><video id="v_catch" class="clip" src="assets/3d/s_catch.mp4" data-start="28.66" data-duration="3.94" data-media-start="0.0" data-track-index="7" muted playsinline></video></div>
      <div class="shot" id="train"><video id="v_train" class="clip" src="assets/footage/train.mp4" data-start="32.6" data-duration="10.44" data-media-start="1.0" data-track-index="8" muted playsinline></video></div>
      <div class="shot" id="field_b"><video id="v_field_b" class="clip" src="assets/footage/field.mp4" data-start="43.04" data-duration="4.56" data-media-start="7.0" data-track-index="9" muted playsinline></video></div>
      <div class="shot" id="hero"><video id="v_hero" class="clip" src="assets/3d/s_hero.mp4" data-start="47.0" data-duration="3.2" data-media-start="0.0" data-track-index="10" muted playsinline></video></div>
      <div id="dim"></div>
      <div class="bar top"></div><div class="bar bot"></div>
      <div class="vignette"></div>
      <div id="redwash"></div>
      <div id="card"></div>
      <div id="words"></div>
      <div id="flash"></div>
      <div class="streak" id="streak1"></div>
      <div class="streak" id="streak2"></div>
      <div class="streak" id="streak3"></div>
      <div class="streak" id="streak4"></div>
      <div id="grain"></div>
      <div id="black"></div>
      <audio id="mix" src="assets/audio/mix.m4a" data-start="0" data-duration="55.0" data-media-start="0" data-track-index="40" data-volume="1"></audio>
    </div>

    <script>
      (function () {
        var E = window.EDIT, tl = gsap.timeline({ paused: true });
        var $ = function (s) { return document.querySelector(s); };
        function mk(tag, cls, html, parent) { var d = document.createElement(tag); if (cls) d.className = cls; if (html != null) d.innerHTML = html; parent.appendChild(d); return d; }
        // entrances never overlap their own exits; exits never write their start state early
        function later(el, from, to, at) { to.immediateRender = false; tl.fromTo(el, from, to, at); }

        // ---------- shots: a slow push (or pull), crossfades, a grade that can move (the light changing) ----------
        E.shots.forEach(function (s) {
          var w = $("#" + s.id);
          if (s.origin) w.style.transformOrigin = s.origin;
          if (s.shift) gsap.set(w, { xPercent: s.shift[0], yPercent: s.shift[1] });
          if (s.img) { tl.set(w, { autoAlpha: 0 }, 0); tl.set(w, { autoAlpha: 1 }, s.at); tl.set(w, { autoAlpha: 0 }, s.to); }
          var p = s.push || [1, 1.03];
          tl.fromTo(w, { scale: p[0] }, { scale: p[1], duration: s.to - s.at, ease: s.pushEase || "none" }, s.at);
          if (s.punch) later(w, { scale: p[0] * s.punch }, { scale: p[0], duration: 0.22, ease: "power3.out" }, s.at);
          if (s.fadeIn) later(w, { opacity: 0 }, { opacity: 1, duration: s.fadeIn, ease: "power1.inOut" }, s.at);
          if (s.fadeOut) later(w, { opacity: 1 }, { opacity: 0, duration: s.fadeOut, ease: "power1.inOut" }, s.to - s.fadeOut);
          if (E.look && !s.grade) w.style.filter = E.look;     // the film's own tone (calm film: warm bone and amber)
          if (s.grade) {
            var g0 = s.grade[0];
            tl.set(w, { filter: "brightness(" + g0[1] + ") saturate(" + g0[2] + ")" }, s.at);
            for (var i = 1; i < s.grade.length; i++) {
              var a = s.grade[i - 1], b = s.grade[i];
              later(w, { filter: "brightness(" + a[1] + ") saturate(" + a[2] + ")" }, { filter: "brightness(" + b[1] + ") saturate(" + b[2] + ")",
                duration: Math.max(0.01, b[0] - a[0]), ease: b[3] || "power1.inOut" }, a[0]);
            }
          }
        });
        // frame sequences: each still shown from its time to the next
        E.shots.forEach(function (s) {
          if (!s.frames) return;
          var imgs = document.querySelectorAll("#" + s.id + " img");
          s.frames.forEach(function (f, i) {
            var nxt = i + 1 < s.frames.length ? s.frames[i + 1] : s.to;
            tl.set(imgs[i], { autoAlpha: 0 }, 0); tl.set(imgs[i], { autoAlpha: 1 }, f); tl.set(imgs[i], { autoAlpha: 0 }, nxt);
          });
        });

        // ---------- words ----------
        E.words.forEach(function (w) {
          var d = mk("div", "word " + w.style, w.html, $("#words"));
          if (w.y != null) d.style.top = w.y + "%";
          if (w.size) d.style.fontSize = w.size + "px";
          if (w.cut) {                                   // hard on, hard off, on a cut: the calm films never animate their words
            tl.set(d, { autoAlpha: 0 }, 0); tl.set(d, { autoAlpha: 1 }, w.at); if (w.out !== false) tl.set(d, { autoAlpha: 0 }, w.to);
            return;
          }
          if (w.style === "huge" || w.style === "serif") {
            later(d, { opacity: 0, scale: 1.12, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.24, ease: "power3.out" }, w.at);
            later(d, { scale: 1 }, { scale: 0.97, duration: Math.max(0.1, w.to - w.at - 0.24), ease: "none" }, w.at + 0.24);
            if (w.out !== false) later(d, { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "none" }, w.to - 0.12);
          } else {
            var fin = w.fin || (w.style === "link" ? 0.8 : w.style === "title" ? 1.1 : 0.9), fout = w.fout || 0.7;
            later(d, { opacity: 0, filter: "blur(10px)", y: 8 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: fin, ease: "power2.out" }, w.at);
            if (w.out !== false) later(d, { opacity: 1 }, { opacity: 0, filter: "blur(6px)", duration: fout, ease: "power2.in" }, w.to - fout);
          }
        });

        // ---------- light ----------
        (E.flashes || []).forEach(function (f) { later("#flash", { opacity: f[1] }, { opacity: 0, duration: f[2] || 0.28, ease: "power2.out" }, f[0]); });
        if (E.kill) {
          later("#redwash", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, E.kill[0]);
          later("#redwash", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.in" }, E.kill[1] - 0.3);
        }
        (E.streaks || []).forEach(function (s, i) {
          var el = "#streak" + (i % 4 + 1);
          later(el, { top: s[1] + "%", x: s[2] > 0 ? -420 : 420, opacity: 0, scaleY: 0.4 },
            { x: s[2] > 0 ? 420 : -420, opacity: 1, scaleY: 1.4, duration: 0.18, ease: "power2.out" }, s[0]);
          later(el, { opacity: 1 }, { opacity: 0, scaleY: 0.2, duration: 0.32, ease: "power2.in" }, s[0] + 0.18);
        });
        (E.dims || []).forEach(function (d) { later("#dim", { opacity: d[2] }, { opacity: d[3], duration: d[1] - d[0], ease: "power1.inOut" }, d[0]); });
        (E.blacks || []).forEach(function (b) { later("#black", { opacity: b[2] }, { opacity: b[3], duration: b[1] - b[0], ease: "power1.inOut" }, b[0]); });

        if (E.letterbox) document.querySelectorAll(".bar").forEach(function (b) { b.style.display = "block"; });   // 2.39:1

        // ---------- panels: the phrase on a run of surfaces, hard cuts ----------
        (E.panels || []).forEach(function (p) {
          var d = mk("div", "panel " + p.cls, '<div class="ph">' + p.html + "</div>", $("#root"));
          if (p.dx) d.style.setProperty("--dx", p.dx + "px");
          tl.set(d, { autoAlpha: 1 }, p.at); tl.set(d, { autoAlpha: 0 }, p.to);
        });

        // ---------- text-only cards: pure black (#000) behind the words, and no grain on them ----------
        var inCard = function (t) { return (E.cards || []).some(function (c) { return t >= c[0] && t < c[1]; }); };
        (E.cards || []).forEach(function (c) { tl.set("#card", { opacity: 1 }, c[0]); tl.set("#card", { opacity: 0 }, c[1]); });

        // ---------- grain: the site's tile, stepped 8 times a second (off on the black cards) ----------
        var G = [[0, 0], [-3, 2], [2, -4], [-4, -2], [3, 3], [-1, 4], [4, -1], [-2, -3]];
        for (var gi = 0; gi < Math.ceil(E.duration * 8); gi++)
          tl.set("#grain", { xPercent: G[gi % 8][0], yPercent: G[(gi * 3 + 1) % 8][1], opacity: inCard(gi / 8) ? 0 : 0.06 }, gi / 8);

        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
